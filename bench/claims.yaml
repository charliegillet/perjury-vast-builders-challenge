# PERJURY bench (FINAL-IDEA-v3 §8). 47 claims: dev 17 (7 lie / 6 truth / 4 unverifiable / 0 compound),
# test 30 (10 lie / 10 truth / 6 unverifiable / 4 compound). tests/test_bench.py pins these counts.
#
# Ground truth (dataset structure, I-24 MOTION / I24-3D, Pack A camera_id i24_cam-1):
#   no pedestrians, cyclists or crashes anywhere; daylight in every scene; location Nashville, TN (I-24).
#   Scene 1 free-flow, 90 s, 17 cams.  Scene 2 snow, slow traffic, 16 cams, NO trailers.
#   Scene 3 stop-and-go, 16 cams.  Trailer-towing vehicles (non-semi) listed in Scene 1 (8) and Scene 3 (6).
# truth_source: dataset_structure = follows from the facts above.
#               eyeball_pending   = needs the two-person eyeball check (§8). Drop the row if the two people disagree.
# expected_atoms: only the atoms we score. `span` must be an exact substring of `text`. The atom scorer matches
#   predicted atoms by span; unlisted predicted atoms are ignored, but they still count toward the claim verdict.
# expected: SUPPORTED | CONTRADICTED | UNVERIFIABLE | MOOT  (MOOT = depends_on parent is CONTRADICTED)
# Promotion (§4) is per type at atom level on DEV: catch >= 80%, false accusation <= 10%, n >= 5. Dev is built so
#   towing, coco_presence, road_surface, traffic_state, lighting and scene_identity each have n >= 5 hard atoms.

claims:
